<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IncubaPro</title>
    <meta name="description" content="Assistente completo para incubação de ovos">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IncubaPro">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%23050505'/><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23F2C94C'/><stop offset='1' stop-color='%23E6B800'/></linearGradient></defs><ellipse cx='256' cy='240' rx='90' ry='130' fill='url(%23g)'/><ellipse cx='256' cy='260' rx='55' ry='75' fill='%23050505' opacity='.25'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
    tailwind.config={theme:{extend:{fontFamily:{sans:['Manrope','sans-serif']},colors:{gold:{100:'#FDEEbb',300:'#F2C94C',400:'#FFD369',500:'#E6B800',600:'#B38F00'},charcoal:{800:'#1A1A1A',900:'#111111',950:'#050505'}},backgroundImage:{'gold-gradient':'linear-gradient(135deg, #F2C94C 0%, #E6B800 100%)'}}}}
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-charcoal-950 text-white font-sans antialiased">
<div class="max-w-md mx-auto min-h-screen flex flex-col relative">
    <header class="shrink-0 flex items-center justify-between px-5 pt-3 pb-2 bg-charcoal-950/95 backdrop-blur-md sticky top-0 z-30">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-gold-gradient flex items-center justify-center"><iconify-icon icon="lucide:egg" width="15" class="text-charcoal-900"></iconify-icon></div>
            <span class="text-base font-bold tracking-tight" id="hTitle">IncubaPro</span>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="openNotifPanel()" class="relative text-neutral-400 hover:text-white transition-colors"><iconify-icon icon="lucide:bell" width="20"></iconify-icon><span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[9px] font-bold flex items-center justify-center hidden" id="badge">0</span></button>
            <button onclick="nav('settings')" class="text-neutral-400 hover:text-white transition-colors"><iconify-icon icon="lucide:settings" width="20"></iconify-icon></button>
        </div>
    </header>
    <main class="flex-1 overflow-y-auto pb-24" id="mainArea">
        <div id="page-home" class="scr on px-5 pt-3 pb-6 space-y-5"></div>
        <div id="page-lots" class="scr px-5 pt-3 pb-6 space-y-4"></div>
        <div id="page-calendar" class="scr px-5 pt-3 pb-6 space-y-5"></div>
        <div id="page-ai" class="scr px-5 pt-3 pb-6" style="height:calc(100vh - 130px)"></div>
        <div id="page-table" class="scr px-5 pt-3 pb-6 space-y-4"></div>
        <div id="page-settings" class="scr px-5 pt-3 pb-6 space-y-5"></div>
    </main>
    <div id="notifPanel">
        <div class="notif-bg" onclick="closeNotifPanel()"></div>
        <div class="notif-drawer" onclick="event.stopPropagation()">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:1.25rem;border-bottom:1px solid rgba(255,255,255,0.05)"><h3 style="font-size:0.875rem;font-weight:700">Notificações</h3><button onclick="closeNotifPanel()" style="background:none;border:none;color:#737373;cursor:pointer"><iconify-icon icon="lucide:x" width="20"></iconify-icon></button></div>
            <div style="padding:1rem;display:flex;flex-direction:column;gap:0.5rem" id="notifList"></div>
        </div>
    </div>
    <div id="modalOverlay">
        <div class="overlay-bg" onclick="closeModal()"></div>
        <div class="overlay-content" id="modalContent" onclick="event.stopPropagation()"></div>
    </div>
    <div id="confirmOverlay">
        <div class="overlay-bg" onclick="closeConf()"></div>
        <div class="overlay-box">
            <div style="background:#111;border-radius:1rem;padding:1.5rem;border:1px solid rgba(255,255,255,0.1);text-align:center" id="confirmContent"></div>
        </div>
    </div>
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-charcoal-950/95 backdrop-blur-md border-t border-white/5">
        <div class="max-w-md mx-auto flex items-center justify-around py-2 px-2">
            <button onclick="nav('home')" class="tb on flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-colors" data-t="home"><iconify-icon icon="lucide:home" width="20"></iconify-icon><span class="text-[10px] font-medium">Início</span><div class="dot w-1 h-1 rounded-full bg-gold-400 opacity-0 transition-opacity"></div></button>
            <button onclick="nav('calendar')" class="tb flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-colors" data-t="calendar"><iconify-icon icon="lucide:calendar" width="20"></iconify-icon><span class="text-[10px] font-medium">Calendário</span><div class="dot w-1 h-1 rounded-full bg-gold-400 opacity-0 transition-opacity"></div></button>
            <button onclick="nav('ai')" class="tb flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-colors relative" data-t="ai"><div class="w-10 h-10 -mt-5 rounded-full bg-gold-gradient flex items-center justify-center shadow-[0_0_20px_-3px_rgba(242,201,76,0.5)]"><iconify-icon icon="lucide:bot" width="20" class="text-charcoal-900"></iconify-icon></div><span class="text-[10px] font-medium -mt-0.5">IA</span><div class="dot w-1 h-1 rounded-full bg-gold-400 opacity-0 transition-opacity"></div></button>
            <button onclick="nav('lots')" class="tb flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-colors" data-t="lots"><iconify-icon icon="lucide:layers" width="20"></iconify-icon><span class="text-[10px] font-medium">Lotes</span><div class="dot w-1 h-1 rounded-full bg-gold-400 opacity-0 transition-opacity"></div></button>
            <button onclick="nav('table')" class="tb flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-colors" data-t="table"><iconify-icon icon="lucide:table-2" width="20"></iconify-icon><span class="text-[10px] font-medium">Tabela</span><div class="dot w-1 h-1 rounded-full bg-gold-400 opacity-0 transition-opacity"></div></button>
        </div>
    </nav>
</div>
<script src="app.js"></script>
</body>
</html>
