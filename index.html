<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Manrope','sans-serif']},colors:{gold:{100:'#FDEEbb',300:'#F2C94C',400:'#FFD369',500:'#E6B800',600:'#B38F00'},charcoal:{800:'#1A1A1A',900:'#111111',950:'#050505'}},backgroundImage:{'gold-gradient':'linear-gradient(135deg,#F2C94C 0%,#E6B800 100%)'}}}}
</script>
<style>
::selection{background:rgba(242,201,76,.2);color:#FFD369}
*{-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none}
.scr{display:none}.scr.on{display:flex;flex-direction:column;animation:fi .25s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes pr{0%{transform:scale(1);opacity:.4}100%{transform:scale(1.8);opacity:0}}
.pd{position:relative}.pd::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid #E6B800;animation:pr 2s ease-out infinite}
.tb.on{color:#E6B800}.tb.on .dot{opacity:1}
.msg{animation:mi .3s ease}@keyframes mi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.tp{animation:bl 1.4s infinite both}.tp:nth-child(2){animation-delay:.2s}.tp:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.2}40%{opacity:1}}
input:focus,textarea:focus,select:focus{outline:none}
::-webkit-scrollbar{width:0;height:0}
.slu{animation:slu .35s cubic-bezier(.16,1,.3,1)}@keyframes slu{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fo{to{opacity:0;transform:translateY(-10px)}}
.mbg{animation:mbg .2s ease}@keyframes mbg{from{opacity:0}to{opacity:1}}
.mbox{animation:mbox .3s cubic-bezier(.16,1,.3,1)}@keyframes mbox{from{opacity:0;transform:scale(.95) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.lot-card{transition:all .2s ease}.lot-card:active{transform:scale(.98)}
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
.progress-fill { transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
.step-card { transition: all 0.3s ease; }
.step-card:active { transform: scale(0.98); }
.step-card.locked { opacity: 0.5; }
</style>
</head>
<body class="bg-charcoal-950 text-white font-sans antialiased">
<div class="max-w-md mx-auto min-h-screen flex flex-col relative">
<header class="shrink-0 flex items-center justify-between px-5 pt-3 pb-2 bg-charcoal-950/95 backdrop-blur-md sticky top-0 z-30">
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-lg bg-gold-gradient flex items-center justify-center"><iconify-icon icon="lucide:egg" width="15" class="text-charcoal-900"></iconify-icon></div>
<span class="text-base font-bold tracking-tight" id="hTitle">IncubaPro</span>
</div>
<div class="flex items-center gap-4">
<button onclick="openNotif()" class="relative text-neutral-400 hover:text-white transition-colors"><iconify-icon icon="lucide:bell" width="20"></iconify-icon><span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[9px] font-bold flex items-center justify-center hidden" id="badge">0</span></button>
<button onclick="nav('settings')" class="text-neutral-400 hover:text-white transition-colors"><iconify-icon icon="lucide:settings" width="20"></iconify-icon></button>
</div>
</header>

<main class="flex-1 overflow-y-auto pb-24" id="mainArea">
<div id="page-home" class="scr on px-5 pt-3 pb-6 space-y-5"></div>
<div id="page-lots" class="scr px-5 pt-3 pb-6 space-y-4"></div>
<div id="page-calendar" class="scr px-5 pt-3 pb-6 space-y-5"></div>
<div id="page-ai" class="scr px-5 pt-3 pb-6" style="height:calc(100vh - 130px)"></div>
<div id="page-table" class="scr px-5 pt-3 pb-6 space-y-4"></div>
<div id="page-settings" class="scr px-5 pt-3 pb-6 space-y-5"></div>
</main>

<div id="notifPanel" class="fixed inset-0 z-50 hidden" onclick="closeNotif()">
<div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
<div class="absolute top-0 right-0 w-full max-w-sm h-full bg-charcoal-950 border-l border-white/10 slu overflow-y-auto" onclick="event.stopPropagation()">
<div class="flex items-center justify-between p-5 border-b border-white/5"><h3 class="text-sm font-bold">Notificações</h3><button onclick="closeNotif()" class="text-neutral-500 hover:text-white"><iconify-icon icon="lucide:x" width="20"></iconify-icon></button></div>
<div class="p-4 space-y-2" id="notifList"></div>
</div>
</div>

<div id="modalOverlay" class="fixed inset-0 z-50 hidden" onclick="closeModal()">
<div class="absolute inset-0 bg-black/70 backdrop-blur-sm mbg"></div>

<div class="absolute inset-0 bg-black/70 backdrop-blur-sm mbg" onclick="closeConf()"></div>

<div class="bg-charcoal-900 rounded-2xl p-6 border border-white/10 text-center" id="confirmContent"></div>
</div>
</div>

<!-- BARRA DE NAVEGAÇÃO COMPLETA (ESTAVA CORTADA NO SEU CÓDIGO) -->
<nav class="fixed bottom-0 left-0 right-0 z-40 bg-charcoal-950/95 backdrop-blur-md border-t border-white/5">
<div class="max-w-md mx-auto flex items-center justify-around py-2 px-1">
<button onclick="nav('home')" class="tb on flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl transition-colors" data-t="home"><iconify-icon icon="lucide:home" width="20"></iconify-icon><span class="text-[10px] font-medium">Início</span><div class="dot w-1 h-1 rounded-full bg-gold-400 opacity-0 transition-opacity"></div></button>
<button onclick="nav('calendar')" class="tb flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl text-neutral-500 transition-colors" data-t="calendar"><iconify-icon icon="lucide:calendar" width="20"></iconify-icon><span class="text-[10px] font-medium">Calendário</span><div class="dot w-1 h-1 rounded-full bg-gold-400 opacity-0 transition-opacity"></div></button>
<button onclick="nav('ai')" class="tb flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl text-neutral-500 transition-colors relative" data-t="ai"><div class="w-10 h-10 -mt-5 rounded-full bg-gold-gradient flex items-center justify-center shadow-[0_0_20px_-3px_rgba(242,201,76,0.5)]"><iconify-icon icon="lucide:bot" width="20" class="text-charcoal-900"></iconify-icon></div><span class="text-[10px] font-medium -mt-0.5">IA</span><div class="dot w-1 h-1 rounded-full bg-gold-400 opacity-0 transition-opacity"></div></button>
<button onclick="nav('lots')" class="tb flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl text-neutral-500 transition-colors" data-t="lots"><iconify-icon icon="lucide:egg" width="20"></iconify-icon><span class="text-[10px] font-medium">Lotes</span><div class="dot w-1 h-1 rounded-full bg-gold-400 opacity-0 transition-opacity"></div></button>
<button onclick="nav('table')" class="tb flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl text-neutral-500 transition-colors" data-t="table"><iconify-icon icon="lucide:book-open" width="20"></iconify-icon><span class="text-[10px] font-medium">Espécies</span><div class="dot w-1 h-1 rounded-full bg-gold-400 opacity-0 transition-opacity"></div></button>

<!-- JAVASCRIPT COMPLETO EMBUTIDO PARA EVITAR ERRO DE CAMINHO -->
<script>
// ================= ESTADO E DADOS =================
const SPECIES = [
    { name: 'Galinha', days: 21, temp: 37.5, humidity: 60 },
    { name: 'Codorna', days: 17, temp: 37.5, humidity: 60 },
    { name: 'Pato', days: 28, temp: 37.5, humidity: 65 },
    { name: 'Ganso', days: 30, temp: 37.5, humidity: 70 },
    { name: 'Marreco', days: 35, temp: 37.2, humidity: 65 },
    { name: 'Pavão', days: 28, temp: 37.2, humidity: 60 },
    { name: 'Peru', days: 28, temp: 37.5, humidity: 65 },
    { name: 'Calopsita', days: 18, temp: 37.3, humidity: 55 }
];

const STEPS = [
    { id: 1, title: 'Antes de Ligar a Chocadeira', desc: 'Configuração inicial, limpeza e teste do equipamento.' },
    { id: 2, title: 'Preparando os Ovos', desc: 'Seleção, armazenamento correto e ponto de ovos férteis.' },
    { id: 3, title: 'Antes de Utilizar a Chocadeira', desc: 'Estabilização de temperatura e umidade ideais.' },
    { id: 4, title: 'Acompanhamento Dia a Dia', desc: 'Viragem de ovos, controle de umidade e temperatura.' },
    { id: 5, title: 'Ovoscopia Crítica', desc: 'Verificação nos dias 7 e 14 para descartar ovos inviáveis.' },
    { id: 6, title: 'Eclosão e Nascimento', desc: 'Preparação do pinteiro, stop da viragem e nascedouro.' }
];

let state = {
    lots: JSON.parse(localStorage.getItem('ip_lots') || '[]'),
    notifs: JSON.parse(localStorage.getItem('ip_notifs') || '[]'),
    chatHistory: JSON.parse(localStorage.getItem('ip_chat') || '[]'),
    groqKey: localStorage.getItem('ip_groq') || '',
    currentStep: parseInt(localStorage.getItem('ip_step') || '1')
};

function save(key, data) { localStorage.setItem(`ip_${key}`, JSON.stringify(data)); }

function formatDate(d) { if(!d) return '-'; return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }); }

function getDaysLeft(startDate, daysTotal) {
    if (!startDate) return 0;
    const start = new Date(startDate + 'T00:00:00');
    const now = new Date(); now.setHours(0,0,0,0);
    return daysTotal - Math.floor((now - start) / (1000 * 60 * 60 * 24));
}

function addNotif(text, type = 'info') {
    state.notifs.unshift({ id: Date.now(), text, type, read: false, date: new Date().toISOString() });
    if (state.notifs.length > 20) state.notifs.pop();
    save('notifs', state.notifs);
    updateBadge();
}

function updateBadge() {
    const unread = state.notifs.filter(n => !n.read).length;
    const b = document.getElementById('badge');
    if (unread > 0) { b.classList.remove('hidden'); b.textContent = unread; } else { b.classList.add('hidden'); }
}

// ================= NAVEGAÇÃO =================
function nav(tab) {
    document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
    document.getElementById(`page-${tab}`).classList.add('on');
    document.querySelectorAll('.tb').forEach(b => {
        b.classList.remove('on'); b.classList.add('text-neutral-500');
        if (b.dataset.t === tab) { b.classList.add('on'); b.classList.remove('text-neutral-500'); }
    });
    const titles = { home: 'IncubaPro', lots: 'Lotes de Incubação', calendar: 'Calendário', ai: 'Assistente IA', table: 'Espécies & Parâmetros', settings: 'Configurações' };
    document.getElementById('hTitle').textContent = titles[tab] || 'IncubaPro';
    
    if (tab === 'home') renderHome();
    if (tab === 'lots') renderLots();
    if (tab === 'calendar') renderCalendar();
    if (tab === 'ai') renderAI();
    if (tab === 'table') renderTable();
    if (tab === 'settings') renderSettings();
    
    document.getElementById('mainArea').scrollTop = 0;
}

// ================= TELA INICIAL (ETAPAS) =================
function renderHome() {
    const el = document.getElementById('page-home');
    const completed = state.currentStep - 1;
    const progress = Math.round((completed / STEPS.length) * 100);

    let stepsHtml = STEPS.map(s => {
        const isDone = s.id < state.currentStep;
        const isCurrent = s.id === state.currentStep;
        const isLocked = s.id > state.currentStep;
        return `
        <div class="step-card ${isLocked ? 'locked' : ''} bg-charcoal-900 border ${isCurrent ? 'border-gold-500/50' : 'border-white/5'} rounded-2xl p-4 flex items-center gap-4 ${!isLocked ? 'cursor-pointer' : ''}" 
             ${!isLocked ? `onclick="handleStep(${s.id})"` : ''}>
            <div class="w-10 h-10 rounded-xl shrink-0 flex items-center justify-center ${isDone ? 'bg-green-500/20 text-green-400' : isCurrent ? 'bg-gold-500/20 text-gold-400' : 'bg-charcoal-800 text-neutral-600'}">
                ${isDone ? '<iconify-icon icon="lucide:check-circle" width="20"></iconify-icon>' : isLocked ? '<iconify-icon icon="lucide:lock" width="18"></iconify-icon>' : `<span class="text-sm font-bold">${s.id}</span>`}
            </div>
            <div class="flex-1">
                <h4 class="text-sm font-bold ${isLocked ? 'text-neutral-600' : 'text-white'}">${s.title}</h4>
                <p class="text-[11px] text-neutral-500 mt-0.5 leading-relaxed">${s.desc}</p>
            </div>
            ${isCurrent ? '<div class="w-2 h-2 rounded-full bg-gold-400 pd"></div>' : ''}
        </div>`;
    }).join('');

    el.innerHTML = `
        <div class="bg-charcoal-900 border border-white/5 rounded-2xl p-5">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-sm font-bold text-neutral-300">Sua Incubação</h2>
                <span class="text-xs font-bold text-gold-400">${completed} de ${STEPS.length} etapas</span>
            </div>
            <div class="w-full h-2 bg-charcoal-800 rounded-full overflow-hidden mb-1">
                <div class="progress-fill h-full rounded-full bg-gold-gradient" style="width: ${progress}%"></div>
            </div>
            <p class="text-[10px] text-neutral-600 text-right">${progress}% concluído</p>
        </div>
        ${stepsHtml}
    `;
}

function handleStep(id) {
    if (id === state.currentStep) {
        showConfirm(`Concluir a etapa "${STEPS[id-1].title}" e avançar?`, () => {
            state.currentStep = id + 1;
            if(state.currentStep > STEPS.length) state.currentStep = 1; // Reseta ao final
            localStorage.setItem('ip_step', state.currentStep);
            addNotif(`Etapa "${STEPS[id-1].title}" concluída!`, 'success');
            renderHome();
        });
    }
}

// ================= TELA LOTES =================
function renderLots() {
    const el = document.getElementById('page-lots');
    let html = `<div class="flex items-center justify-between"><h2 class="text-lg font-bold">Lotes de Incubação</h2><button onclick="openAddLotModal()" class="text-xs font-bold text-gold-400 bg-gold-500/10 px-3 py-1.5 rounded-lg">+ Novo Lote</button></div>`;
    if (state.lots.length === 0) {
        html += `<div class="text-center py-16 text-neutral-600"><iconify-icon icon="lucide:package-open" width="40" class="mx-auto mb-3"></iconify-icon><p class="text-sm">Nenhum lote registrado.</p></div>`;
    } else {
        html += state.lots.map(l => {
            const sc = l.status === 'incubando' ? 'text-blue-400 bg-blue-400/10' : l.status === 'nascido' ? 'text-green-400 bg-green-400/10' : 'text-red-400 bg-red-400/10';
            return `<div class="lot-card bg-charcoal-900 border border-white/5 rounded-2xl p-4 cursor-pointer" onclick="openLotDetails('${l.id}')"><div class="flex items-center justify-between mb-1"><h4 class="text-sm font-bold">${l.name}</h4><span class="text-[10px] font-semibold px-2 py-0.5 rounded-md ${sc}">${l.status}</span></div><div class="flex items-center gap-4 text-xs text-neutral-500"><span>${l.species}</span><span>${l.qty} ovos</span><span>Restam: ${getDaysLeft(l.startDate, l.days)}d</span></div></div>`;
        }).join('');
    }
    el.innerHTML = html;
}

function openAddLotModal() {
    const specOpts = SPECIES.map(s => `<option value="${s.name}">${s.name} (${s.days} dias)</option>`).join('');
    document.getElementById('modalContent').innerHTML = `
    <div class="bg-charcoal-900 rounded-t-3xl p-6 border-t border-x border-white/10 max-h-[85vh] overflow-y-auto">
        <div class="w-10 h-1 bg-neutral-700 rounded-full mx-auto mb-5"></div>
        <h3 class="text-lg font-bold mb-5">Novo Lote</h3>
        <div class="space-y-4">
            <div><label class="text-xs text-neutral-400 font-medium mb-1 block">Nome do Lote</label><input id="mLotName" type="text" placeholder="Ex: Lote 01" class="w-full bg-charcoal-800 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-neutral-600 focus:border-gold-500 transition-colors"></div>
            <div><label class="text-xs text-neutral-400 font-medium mb-1 block">Espécie</label><select id="mLotSpec" onchange="toggleCustom()" class="w-full bg-charcoal-800 border border-white/10 rounded-xl px-4 py-3 text-sm text-white appearance-none focus:border-gold-500 transition-colors"><option value="">Selecione...</option>${specOpts}<option value="custom">Outra espécie (Personalizada)</option></select></div>
            <div id="customFields" class="hidden space-y-4 p-4 bg-charcoal-800/50 rounded-xl border border-white/5">
                <input id="mCName" type="text" placeholder="Nome da Ave" class="w-full bg-charcoal-800 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-neutral-600 focus:border-gold-500 transition-colors">
                <div class="grid grid-cols-3 gap-3">
                    <input id="mCDays" type="number" placeholder="Dias" class="bg-charcoal-800 border border-white/10 rounded-xl px-3 py-3 text-sm text-white text-center placeholder-neutral-600 focus:border-gold-500 transition-colors">
                    <input id="mCTemp" type="number" step="0.1" placeholder="Temp °C" class="bg-charcoal-800 border border-white/10 rounded-xl px-3 py-3 text-sm text-white text-center placeholder-neutral-600 focus:border-gold-500 transition-colors">
                    <input id="mCHum" type="number" placeholder="Umid %" class="bg-charcoal-800 border border-white/10 rounded-xl px-3 py-3 text-sm text-white text-center placeholder-neutral-600 focus:border-gold-500 transition-colors">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div><label class="text-xs text-neutral-400 font-medium mb-1 block">Qtd. de Ovos</label><input id="mLotQty" type="number" placeholder="12" class="w-full bg-charcoal-800 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-neutral-600 focus:border-gold-500 transition-colors"></div>
                <div><label class="text-xs text-neutral-400 font-medium mb-1 block">Início</label><input id="mLotDate" type="date" value="${new Date().toISOString().split('T')[0]}" class="w-full bg-charcoal-800 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:border-gold-500 transition-colors"></div>
            </div>
            <button onclick="saveLot()" class="w-full bg-gold-gradient text-charcoal-900 font-bold text-sm py-3.5 rounded-xl hover:opacity-90 transition-opacity">Salvar Lote</button>
        </div>
    </div>`;
    openModal();
}

function toggleCustom() { document.getElementById('customFields').classList.toggle('hidden', document.getElementById('mLotSpec').value !== 'custom'); }

function saveLot() {
    const name = document.getElementById('mLotName').value.trim();
    const specVal = document.getElementById('mLotSpec').value;
    const qty = parseInt(document.getElementById('mLotQty').value);
    const startDate = document.getElementById('mLotDate').value;
    if (!name || !specVal || !qty || !startDate) return addNotif('Preencha todos os campos.', 'error');
    let speciesName, days, temp, humidity;
    if (specVal === 'custom') {
        speciesName = document.getElementById('mCName').value.trim(); days = parseInt(document.getElementById('mCDays').value); temp = parseFloat(document.getElementById('mCTemp
